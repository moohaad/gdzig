name: Test with Godot
description: Run gdzig tests against a specific Godot version

inputs:
  godot-version:
    description: Full Godot version to test with, e.g. "4.7.1"
    required: true
  cache-key:
    description: Cache key for Zig build artifacts
    required: true

runs:
  using: composite
  steps:
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        # Pinned rather than inferred: gdzig uses `std.Io`, which is 0.16-only.
        version: 0.16.0
        cache-key: ${{ inputs.cache-key }}

    - name: Cache Godot
      id: cache-godot
      uses: actions/cache@v4
      with:
        path: .godot-ci
        key: godot-${{ runner.os }}-${{ inputs.godot-version }}

    # Downloaded here rather than via `-Dgodot-version`, even though that now
    # works: this pins the exact build per platform and caches it under CI's own
    # key, and it keeps the test run independent of the downloader in
    # `build/godot/`, which is itself part of what is being tested.
    - name: Download Godot
      if: steps.cache-godot.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        v='${{ inputs.godot-version }}'
        case '${{ runner.os }}' in
          Linux)   asset="Godot_v${v}-stable_linux.x86_64.zip" ;;
          macOS)   asset="Godot_v${v}-stable_macos.universal.zip" ;;
          Windows) asset="Godot_v${v}-stable_win64.exe.zip" ;;
          *) echo "unsupported runner OS: ${{ runner.os }}" >&2; exit 1 ;;
        esac
        url="https://github.com/godotengine/godot-builds/releases/download/${v}-stable/${asset}"
        echo "Downloading $url"
        curl -fsSL --retry 3 --retry-delay 5 -o godot.zip "$url"
        mkdir -p .godot-ci
        if command -v unzip >/dev/null 2>&1; then
          unzip -q godot.zip -d .godot-ci
        else
          7z x -o.godot-ci godot.zip >/dev/null
        fi
        rm -f godot.zip

    - name: Locate Godot binary
      shell: bash
      run: |
        set -euo pipefail
        # Mirrors findGodotExecutable in the godot-versions dependency: match
        # Godot_v* or Godot.*, skip the _console build, handle the macOS bundle.
        if [ -d .godot-ci/Godot.app ]; then
          bin=.godot-ci/Godot.app/Contents/MacOS/Godot
        else
          bin=$(find .godot-ci -maxdepth 2 -type f \( -name 'Godot_v*' -o -name 'Godot.*' \) \
                ! -name '*_console*' | head -1)
        fi
        if [ -z "${bin:-}" ] || [ ! -f "$bin" ]; then
          echo "no Godot binary found under .godot-ci" >&2
          ls -laR .godot-ci >&2 || true
          exit 1
        fi
        chmod +x "$bin"
        # `-Dgodot-path` is resolved with `.cwd_relative` and does not accept a
        # relative path here; it must be absolute.
        abs="$(cd "$(dirname "$bin")" && pwd)/$(basename "$bin")"
        # On Windows this shell is Git Bash, whose absolute paths look like
        # /d/a/gdzig/... -- meaningless to a native Windows Zig. `cygpath -m`
        # rewrites that to C:/... , the form `-Dgodot-path` expects.
        if [ '${{ runner.os }}' = 'Windows' ]; then
          abs="$(cygpath -m "$abs")"
        fi
        echo "GODOT_BIN=$abs" >> "$GITHUB_ENV"

    - name: Report Godot version
      shell: bash
      run: '"$GODOT_BIN" --version'

    - name: Run tests
      shell: bash
      run: zig build test -Dgodot-path="$GODOT_BIN"

    # Separate step so a surface regression is distinguishable from a test
    # failure. Kept off the default build: it analyses every generated
    # declaration, and that cost should not land on every local `zig build
    # test` when CI can carry it.
    - name: Type-check the generated surface
      shell: bash
      run: zig build test -Dgodot-path="$GODOT_BIN" -Dsurface-audit

    # The two steps above cannot see a marshalling path that nothing calls: a
    # new shape still type-checks, and still passes every test that does not
    # exercise it. This is the step that notices.
    #
    # The two thresholds do different jobs and are deliberately set differently:
    #
    #   --min-coverage guards our own tests going backwards. One point of
    #   headroom under the 88.4% currently measured, so ordinary engine churn
    #   does not fail the build -- a floor that trips on every upgrade just
    #   teaches people to lower it. Deleting test/shapes would drop this to
    #   ~22%.
    #
    #   --max-uncovered guards new engine surface, which is the precise thing a
    #   Godot upgrade brings and which the percentage can hide: a big new
    #   uncovered shape moves the total by a fraction of a point. The largest
    #   currently-uncovered shape is 49 methods, so 100 fires only on something
    #   genuinely new and large. When it does, the fix is a test, not a bigger
    #   number.
    - name: Audit marshalling-shape coverage
      shell: bash
      run: |
        set -euo pipefail
        # Dumped from the engine under test rather than read out of
        # zig-out/vendor, which none of the steps above produce.
        "$GODOT_BIN" --headless --dump-extension-api
        zig build audit -Dgodot-path="$GODOT_BIN"
        ./zig-out/bin/gdzig-api-audit shapes \
          --min-coverage=87 --max-uncovered=100 \
          extension_api.json test

    # Everything above loads the extension exactly once, and that is the gap
    # this closes: the reload defects fixed in this tree all passed a cold
    # start and failed only on the second load. The harness drives a real
    # editor through `reload_extension` and checks what survived.
    #
    # Both halves run, which is why the tag dance is here. Reloading the same
    # binary proves the machinery is sound but not that a rebuild is picked up
    # -- a stale library keeps answering the old `build_tag` however cleanly it
    # reloaded. So: flip the tag, stage that build, put the tree back, and
    # rebuild so the live library is the original again. Skip the staging and
    # the driver prints `skip` and stays green, which would make this half a
    # test.
    #
    # Last in the file on purpose. It is the only step here that has never run
    # on a non-Windows machine, and a step that new should not be able to stop
    # the audits above from reporting.
    - name: Reload the extension and check what survived
      shell: bash
      working-directory: example
      run: |
        set -euo pipefail
        case '${{ runner.os }}' in
          macOS)   lib=libexample.dylib ;;
          Windows) lib=example.dll ;;
          *)       lib=libexample.so ;;
        esac

        # `sed -i` is spelled differently on BSD and GNU; this is neither.
        restore() { git checkout -- src/ConfigNode.zig; }
        trap restore EXIT
        tmp=$(mktemp)
        sed 's/return 1;/return 2;/' src/ConfigNode.zig > "$tmp"
        mv "$tmp" src/ConfigNode.zig

        zig build -Dgodot-path="$GODOT_BIN"
        cp "project/lib/$lib" "project/lib/next_$lib"
        restore
        # Restores the live library too: the driver swaps the staged build over
        # it and does not put it back, so the harness must start from a build
        # the build system wrote.
        zig build -Dgodot-path="$GODOT_BIN"

        zig build reload-test -Dgodot-path="$GODOT_BIN"
