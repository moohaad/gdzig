name: Integration Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Quick gate for PRs: the newest supported Godot, on Linux only.
  test-pr:
    name: Test Godot ${{ matrix.godot }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        godot: ["4.7.1"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/test-godot
        with:
          godot-version: ${{ matrix.godot }}
          cache-key: ${{ matrix.os }}-godot-${{ matrix.godot }}

  # gdzig targets Godot 4.7 only, so the matrix is one version across the three
  # host platforms rather than a spread of versions on one.
  test-full:
    name: Test Godot ${{ matrix.godot }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        godot: ["4.7.1"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows previously hung here. The cause was very likely the test
      # coordinator piping the child's stderr and never draining it, which
      # deadlocks Godot as soon as a test makes it print. That is fixed -- the
      # drain now runs on its own task -- so Windows gates again. If it hangs,
      # look there first.
      - uses: ./.github/actions/test-godot
        with:
          godot-version: ${{ matrix.godot }}
          cache-key: ${{ matrix.os }}-godot-${{ matrix.godot }}
